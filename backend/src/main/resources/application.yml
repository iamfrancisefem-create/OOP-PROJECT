# =============================================================================
# Project Management System — Default Configuration
# =============================================================================

spring:
  application:
    name: project-management-system

  # ---------------------------------------------------------------------------
  # JPA / Hibernate
  # ---------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # ---------------------------------------------------------------------------
  # Flyway Database Migrations
  # ---------------------------------------------------------------------------
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # ---------------------------------------------------------------------------
  # File Upload Limits
  # ---------------------------------------------------------------------------
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  # ---------------------------------------------------------------------------
  # Mail (SMTP) — SendGrid (recommended for Railway) or Gmail
  #   SendGrid: MAIL_HOST=smtp.sendgrid.net  MAIL_USERNAME=apikey  MAIL_PASSWORD=<api-key>
  #   Gmail:    MAIL_HOST=smtp.gmail.com     MAIL_USERNAME=<email> MAIL_PASSWORD=<app-password>
  # ---------------------------------------------------------------------------
  mail:
    host: ${MAIL_HOST:smtp.sendgrid.net}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:apikey}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# =============================================================================
# Server
# =============================================================================
server:
  port: 8080

# =============================================================================
# JWT Configuration
# =============================================================================
jwt:
  # IMPORTANT: Override JWT_SECRET in production with a strong, unique Base64-encoded value.
  # Default below is for development only and MUST be changed in production.
  secret: ${JWT_SECRET:ZGV2LW9ubHktam10LXNlY3JldC1kby1ub3QtdXNlLWluLXByb2Q=}
  access-token-expiration: 900000        # 15 minutes in milliseconds
  refresh-token-expiration: 604800000    # 7 days
  reset-token-expiration: 1800000       # 30 minutes

# =============================================================================
# File Storage
# =============================================================================
file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}
  allowed-types: pdf,docx,jpg,jpeg,png,zip,xlsx

# =============================================================================
# CORS
# =============================================================================
app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:*,http://127.0.0.1:*,https://*.vercel.app,*}

# =============================================================================
# Logging
# =============================================================================
logging:
  level:
    com.pms: INFO
    org.springframework.security: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
