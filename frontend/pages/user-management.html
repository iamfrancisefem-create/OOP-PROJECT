<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>User Management — ProjectFlow</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="../assets/css/dashboard.css">
  <link rel="stylesheet" href="../assets/css/forms.css">
  <link rel="stylesheet" href="../assets/css/responsive.css">
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/toastify-js@1.12.0/src/toastify.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js@1.12.0/src/toastify.min.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebarContainer"></div>
    <div class="main-content">
      <div id="navbarContainer"></div>
      <div class="page-body">
        <div class="section-header">
          <div>
            <h2>User Management</h2>
            <p>Manage user roles and permissions</p>
          </div>
          <div class="flex gap-3">
            <div class="search-bar">
              <i class="fa-solid fa-search"></i>
              <input type="text" id="userSearch" placeholder="Search users...">
            </div>
            <button class="btn btn-primary btn-sm" id="createUserBtn"><i class="fa-solid fa-plus"></i> Create User</button>
            <button class="btn btn-outline btn-sm" id="inviteUserBtn"><i class="fa-solid fa-envelope"></i> Invite by Email</button>
          </div>
        </div>
        <div class="glass-card">
          <div class="table-wrapper">
            <table class="table" id="userTable">
              <thead>
                <tr>
                  <th>User Name</th>
                  <th>Email</th>
                  <th>Current Role</th>
                  <th>Account Status</th>
                  <th>Date Joined</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="userTableBody">
                <tr><td colspan="6" class="text-muted" style="text-align:center;padding:32px">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
        <div id="userPagination" class="mt-6 flex justify-end"></div>

        <div class="glass-card" id="pendingInvitesSection" style="display:none">
          <div class="section-header" style="margin-bottom:var(--space-4)">
            <div>
              <h3>Pending Invitations</h3>
              <p>Invitations sent but not yet accepted</p>
            </div>
          </div>
          <div class="table-wrapper">
            <table class="table">
              <thead>
                <tr>
                  <th>Email</th>
                  <th>Role</th>
                  <th>Invited By</th>
                  <th>Sent</th>
                  <th>Expires</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="pendingInvitesBody">
                <tr><td colspan="6" class="text-muted" style="text-align:center;padding:24px">Loading...</td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div id="modalContainer"></div>

  <!-- Invite User Modal -->
  <div class="modal-overlay" id="inviteUserModal" style="display:none">
    <div class="modal-content glass-card" style="max-width:480px;width:100%">
      <div class="modal-header" style="display:flex;justify-content:space-between;align-items:center;padding:20px 24px 0">
        <h3 style="margin:0;font-size:18px"><i class="fa-solid fa-envelope" style="margin-right:8px"></i>Invite User</h3>
        <button class="modal-close" id="closeInviteUserModal" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-muted)">&times;</button>
      </div>
      <div class="modal-body" style="padding:20px 24px">
        <form id="inviteUserForm">
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="invEmail" required placeholder="e.g. jane@example.com">
          </div>
          <div class="form-group">
            <label class="form-label">Role to Assign</label>
            <select class="form-select" id="invRole">
              <option value="PROJECT_MANAGER">Project Manager</option>
              <option value="TEAM_LEADER">Team Leader</option>
              <option value="PRODUCT_OWNER">Product Owner</option>
              <option value="TEAM_MEMBER" selected>Team Member</option>
            </select>
          </div>
          <div class="flex gap-3" style="justify-content:flex-end;margin-top:20px">
            <button type="button" class="btn btn-outline" id="cancelInviteUser">Cancel</button>
            <button type="submit" class="btn btn-primary" id="submitInviteUser"><i class="fa-solid fa-paper-plane"></i> Send Invitation</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Create User Modal -->
  <div class="modal-overlay" id="createUserModal" style="display:none">
    <div class="modal-content glass-card" style="max-width:480px;width:100%">
      <div class="modal-header" style="display:flex;justify-content:space-between;align-items:center;padding:20px 24px 0">
        <h3 style="margin:0;font-size:18px"><i class="fa-solid fa-user-plus" style="margin-right:8px"></i>Create User</h3>
        <button class="modal-close" id="closeCreateUserModal" style="background:none;border:none;font-size:22px;cursor:pointer;color:var(--text-muted)">&times;</button>
      </div>
      <div class="modal-body" style="padding:20px 24px">
        <form id="createUserForm">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-control" id="cuFullName" required placeholder="e.g. Jane Smith">
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" id="cuEmail" required placeholder="e.g. jane@example.com">
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="cuPassword" required placeholder="Create a password">
          </div>
          <div class="form-group">
            <label class="form-label">Phone (optional)</label>
            <input type="text" class="form-control" id="cuPhone" placeholder="e.g. +1234567890">
          </div>
          <div class="form-group">
            <label class="form-label">Role</label>
            <select class="form-select" id="cuRole">
              <option value="PROJECT_MANAGER">Project Manager</option>
              <option value="TEAM_LEADER">Team Leader</option>
              <option value="PRODUCT_OWNER">Product Owner</option>
              <option value="TEAM_MEMBER" selected>Team Member</option>
            </select>
          </div>
          <div class="flex gap-3" style="justify-content:flex-end;margin-top:20px">
            <button type="button" class="btn btn-outline" id="cancelCreateUser">Cancel</button>
            <button type="submit" class="btn btn-primary" id="submitCreateUser"><i class="fa-solid fa-user-plus"></i> Create Account</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module">
    import { UserAPI, InviteAPI } from '../assets/js/api.js';
    import { Theme, Session, authGuard, initSidebar, toast, confirmDialog, renderPagination, ROLES, DateHelper } from '../assets/js/utils.js';

    if (!authGuard()) throw new Error('Not authenticated');
    Theme.init();
    const page = 'user-management';
    let currentPage = 0, totalPages = 0;

    async function loadComponent(url, containerId, cb) {
      try {
        const res = await fetch(url + '?v=' + Date.now());
        document.getElementById(containerId).innerHTML = await res.text();
        if (cb) cb();
      } catch (e) {
        console.error('Failed to load component:', url, e);
      }
    }

    // ─── Invite User Modal ─────────────────────────────────
    function openInviteUserModal() {
      document.getElementById('inviteUserModal').style.display = 'flex';
    }
    function closeInviteUserModal() {
      document.getElementById('inviteUserModal').style.display = 'none';
      document.getElementById('inviteUserForm').reset();
    }

    async function handleInviteUser(e) {
      e.preventDefault();
      const email = document.getElementById('invEmail').value.trim();
      const role = document.getElementById('invRole').value;

      if (!email) { toast('Email is required.', 'warning'); return; }

      const submitBtn = document.getElementById('submitInviteUser');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending...';

      try {
        const res = await InviteAPI.create({ email, role });
        const invite = res.data.data;
        let msg = `Invitation sent to ${email}!`;
        if (invite.inviteLink) {
          msg += ` Link: ${invite.inviteLink}`;
        }
        toast(msg, 'success');
        closeInviteUserModal();
        loadPendingInvites();
      } catch (e) {
        toast(e.response?.data?.message || 'Failed to send invitation', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send Invitation';
      }
    }

    async function loadPendingInvites() {
      const section = document.getElementById('pendingInvitesSection');
      const tbody = document.getElementById('pendingInvitesBody');
      try {
        const res = await InviteAPI.getAll();
        const invites = res.data.data || [];
        if (!invites.length) { section.style.display = 'none'; return; }
        section.style.display = '';
        tbody.innerHTML = invites.map(inv => {
          const expDate = new Date(inv.expiresAt);
          const isExpired = expDate < new Date();
          return `
          <tr>
            <td>${inv.email}</td>
            <td><span class="badge badge-info" style="font-size:11px">${inv.role.replace(/_/g, ' ')}</span></td>
            <td>${inv.invitedBy || 'N/A'}</td>
            <td>${DateHelper.format(inv.createdAt)}</td>
            <td style="color:${isExpired ? 'var(--danger)' : 'inherit'}">${DateHelper.format(inv.expiresAt)}${isExpired ? ' (Expired)' : ''}</td>
            <td>
              <div class="flex items-center gap-2" style="display:inline-flex;gap:8px">
                <button class="btn btn-sm btn-outline btn-copy-invite" data-link="${inv.inviteLink || ''}" style="font-size:12px;padding:4px 10px"><i class="fa-solid fa-link"></i> Copy Link</button>
                <button class="btn btn-sm btn-outline btn-cancel-invite" data-id="${inv.id}" style="color:var(--danger);font-size:12px;padding:4px 10px"><i class="fa-solid fa-times"></i> Cancel</button>
              </div>
            </td>
          </tr>`;
        }).join('');

        tbody.querySelectorAll('.btn-copy-invite').forEach(btn => {
          btn.addEventListener('click', () => {
            const link = btn.dataset.link;
            if (!link) { toast('No invite link available', 'warning'); return; }
            navigator.clipboard.writeText(link).then(() => toast('Invite link copied!', 'success')).catch(() => toast('Failed to copy', 'error'));
          });
        });
        tbody.querySelectorAll('.btn-cancel-invite').forEach(btn => {
          btn.addEventListener('click', () => cancelInviteHandler(btn.dataset.id));
        });
      } catch (e) {
        console.error('Failed to load invites:', e);
        section.style.display = 'none';
      }
    }

    async function cancelInviteHandler(id) {
      const ok = await confirmDialog('Cancel Invitation', 'Are you sure you want to cancel this invitation?', 'Cancel Invitation');
      if (!ok) return;
      try {
        await InviteAPI.cancel(id);
        toast('Invitation cancelled', 'success');
        loadPendingInvites();
      } catch (e) {
        toast(e.response?.data?.message || 'Failed to cancel invitation', 'error');
      }
    }

    // ─── Create User Modal ─────────────────────────────────
    function openCreateUserModal() {
      document.getElementById('createUserModal').style.display = 'flex';
    }
    function closeCreateUserModal() {
      document.getElementById('createUserModal').style.display = 'none';
      document.getElementById('createUserForm').reset();
    }

    async function handleCreateUser(e) {
      e.preventDefault();
      const fullName = document.getElementById('cuFullName').value.trim();
      const email = document.getElementById('cuEmail').value.trim();
      const password = document.getElementById('cuPassword').value;
      const phone = document.getElementById('cuPhone').value.trim();
      const role = document.getElementById('cuRole').value;

      if (!fullName || !email || !password) {
        toast('Full Name, Email, and Password are required.', 'warning');
        return;
      }

      const submitBtn = document.getElementById('submitCreateUser');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Creating...';

      try {
        const res = await UserAPI.create({ fullName, email, password, phone, role });
        const user = res.data.data;
        let msg = `User created successfully!`;
        if (user.setupLink) {
          msg += ` Login link: ${user.setupLink}`;
        }
        toast(msg, 'success');
        closeCreateUserModal();
        loadUsers(currentPage);
      } catch (e) {
        toast(e.response?.data?.message || 'Failed to create user', 'error');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-solid fa-user-plus"></i> Create Account';
      }
    }

    async function canViewUsers() {
      try {
        const res = await UserAPI.countCreatedByMe();
        return (res.data.data || 0) > 0;
      } catch { return true; }
    }

    async function loadUsers(p = 0) {
      currentPage = p;
      const tbody = document.getElementById('userTableBody');
      const canView = await canViewUsers();
      if (!canView) {
        tbody.innerHTML = '<tr><td colspan="6" class="text-muted" style="text-align:center;padding:40px"><i class="fa-solid fa-users" style="font-size:32px;opacity:0.3;margin-bottom:12px;display:block"></i>No users yet. Create your first user to get started.</td></tr>';
        return;
      }
      tbody.innerHTML = '<tr><td colspan="6" class="text-muted">Loading...</td></tr>';
      try {
        const res = await UserAPI.getAll(p, 20);
        const data = res.data.data;
        const users = data.content || data || [];
        totalPages = data.totalPages || 1;
        if (!users.length) {
          tbody.innerHTML = '<tr><td colspan="6" class="text-muted">No users found.</td></tr>';
          return;
        }
        tbody.innerHTML = users.map(u => {
          const currentRole = u.roles?.[0] || 'NONE';
          const roleBadgeClass = currentRole === 'ADMIN' ? 'badge-danger' :
                                 currentRole === 'PROJECT_MANAGER' ? 'badge-primary' :
                                 currentRole === 'TEAM_LEADER' ? 'badge-warning' :
                                 currentRole === 'PRODUCT_OWNER' ? 'badge-info' : 'badge-neutral';
          const statusBadge = u.enabled
            ? `<span class="badge badge-success" style="padding:4px 8px;font-size:11px">Active</span>`
            : `<span class="badge badge-danger" style="padding:4px 8px;font-size:11px">Disabled</span>`;
          const dateJoined = DateHelper.format(u.createdAt);
          
          return `
          <tr>
            <td>
              <div class="user-cell" style="display:flex;align-items:center;gap:10px">
                <div class="mini-avatar" style="width:32px;height:32px;border-radius:50%;background:#6366f1;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px">${(u.fullName || u.email || '?')[0].toUpperCase()}</div>
                <span style="font-weight:600;color:var(--text-primary)">${u.fullName || 'N/A'}</span>
              </div>
            </td>
            <td>${u.email}</td>
            <td><span class="role-badge badge ${roleBadgeClass}" style="display:inline-flex;font-size:11px;padding:3px 10px">${currentRole.replace(/_/g, ' ')}</span></td>
            <td>${statusBadge}</td>
            <td>${dateJoined}</td>
            <td>
              <div class="flex items-center gap-2" style="display:inline-flex;align-items:center;gap:8px">
                <select class="form-select role-select" data-user-id="${u.id}" data-current-role="${currentRole}" style="width:auto;min-width:140px;padding:4px 8px;font-size:13px">
                  <option value="NONE" ${currentRole === 'NONE' ? 'selected' : ''}>— No Role —</option>
                  ${Object.values(ROLES).map(r => `<option value="${r}" ${currentRole === r ? 'selected' : ''}>${r.replace(/_/g, ' ')}</option>`).join('')}
                </select>
                ${currentRole !== 'NONE' ? `<button class="btn btn-sm btn-outline btn-remove-role" data-user-id="${u.id}" style="color:var(--danger);padding:6px 10px;font-size:12px"><i class="fa-solid fa-user-minus"></i> Remove</button>` : ''}
              </div>
            </td>
          </tr>
          `;
        }).join('');
        
        document.querySelectorAll('.role-select').forEach(sel => {
          sel.addEventListener('change', () => changeUserRole(sel));
        });
        document.querySelectorAll('.btn-remove-role').forEach(btn => {
          btn.addEventListener('click', () => removeUserRoleHandler(btn.dataset.userId));
        });
        renderPagination('userPagination', currentPage, totalPages, loadUsers);
      } catch (e) {
        console.error('Failed to load users:', e);
        tbody.innerHTML = '<tr><td colspan="6" class="text-muted">Failed to load users. Check console (F12) for details.</td></tr>';
      }
    }

    async function changeUserRole(selectEl) {
      const userId = selectEl.dataset.userId;
      const newRole = selectEl.value;
      const currentRole = selectEl.dataset.currentRole;
      if (newRole === currentRole) return;

      if (newRole === 'NONE') {
        selectEl.value = currentRole; // restore select value first
        removeUserRoleHandler(userId);
        return;
      }

      const ok = await confirmDialog(
        'Change User Role',
        `Are you sure you want to change this user's role to ${newRole.replace(/_/g, ' ')}?`,
        'Change Role'
      );
      if (!ok) {
        selectEl.value = currentRole;
        return;
      }

      try {
        const currentUser = Session.getUser();
        await UserAPI.updateRole(userId, { role: newRole });
        toast('User role updated successfully', 'success');
        loadUsers(currentPage);

        if (currentUser && userId == currentUser.id) {
          const refreshed = await UserAPI.getById(userId);
          const u = refreshed.data.data;
          Session.set(Session.getToken(), Session.getRefresh(), { email: u.email, fullName: u.fullName, phone: u.phone, profileImage: u.profileImage, roles: u.roles, id: u.id });
        }
      } catch (e) {
        selectEl.value = currentRole;
        toast(e.response?.data?.message || 'Failed to update role', 'error');
      }
    }

    async function removeUserRoleHandler(userId) {
      const ok = await confirmDialog(
        'Remove User Role',
        `Are you sure you want to remove this user's role?`,
        'Remove Role'
      );
      if (!ok) return;

      try {
        const currentUser = Session.getUser();
        await UserAPI.removeRole(userId);
        toast('User role removed successfully', 'success');
        loadUsers(currentPage);

        if (currentUser && userId == currentUser.id) {
          const refreshed = await UserAPI.getById(userId);
          const u = refreshed.data.data;
          Session.set(Session.getToken(), Session.getRefresh(), { email: u.email, fullName: u.fullName, phone: u.phone, profileImage: u.profileImage, roles: u.roles, id: u.id });
        }
      } catch (e) {
        toast(e.response?.data?.message || 'Failed to remove role', 'error');
      }
    }

    async function init() {
      try {
        await loadComponent('../components/navbar.html', 'navbarContainer');
      await loadComponent('../components/sidebar.html', 'sidebarContainer', () => initSidebar(page));
        await loadUsers(0);
        await loadPendingInvites();
      } catch (e) {
        console.error('Init error:', e);
      }
      document.getElementById('createUserBtn').addEventListener('click', openCreateUserModal);
      document.getElementById('closeCreateUserModal').addEventListener('click', closeCreateUserModal);
      document.getElementById('cancelCreateUser').addEventListener('click', closeCreateUserModal);
      document.getElementById('createUserForm').addEventListener('submit', handleCreateUser);
      document.getElementById('createUserModal').addEventListener('click', e => {
        if (e.target === e.currentTarget) closeCreateUserModal();
      });
      document.getElementById('inviteUserBtn').addEventListener('click', openInviteUserModal);
      document.getElementById('closeInviteUserModal').addEventListener('click', closeInviteUserModal);
      document.getElementById('cancelInviteUser').addEventListener('click', closeInviteUserModal);
      document.getElementById('inviteUserForm').addEventListener('submit', handleInviteUser);
      document.getElementById('inviteUserModal').addEventListener('click', e => {
        if (e.target === e.currentTarget) closeInviteUserModal();
      });
      document.getElementById('userSearch').addEventListener('input', e => {
        const q = e.target.value.toLowerCase();
        document.querySelectorAll('#userTableBody tr').forEach(row => {
          const text = row.textContent.toLowerCase();
          row.style.display = text.includes(q) ? '' : 'none';
        });
      });
    }
    init();
  </script>
</body>
</html>
